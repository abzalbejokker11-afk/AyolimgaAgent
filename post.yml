name: Islomiy Avto-Post

on:
  schedule:
    # O'zbekiston vaqti bilan (UTC+5):
    # 09:00, 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00
    # UTC hisobida esa 04:00 dan 11:00 gacha bo'ladi
    - cron: '0 4-11 * * *'
  workflow_dispatch: 

jobs:
  post_yuborish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repozitoriyni yuklab olish
        uses: actions/checkout@v4

      - name: Python'ni o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Islomiy postni yaratish va yuborish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python autopost.py
